# OpenFaaS on Docker Swarm — hand-written stack, pinned to the last PULLABLE image set.
#
# Verified 2026-08-05:
#   - openfaas/faas tags are sparse (0.25.4, 0.27.10-14); none ship a swarm deploy script.
#   - OpenFaaS dropped Docker Swarm support: 0.27.14 README documents only k8s / OpenShift / faasd.
#   - The old `openfaas/*:0.17.x` images referenced by the archived faas-swarm repo's
#     contrib/docker-compose.yml are DELETED from Docker Hub (verified via registry manifests).
#   - The last era-coherent, still-pullable swarm image set is the 2019 `functions/*` line
#     (gateway 0.8.3 + faas-swarm 0.3.3 + queue-worker 0.4.6). All verified pullable.
#   - gateway 0.8.3 predates HTTP basic auth, so basic-auth-plugin/secrets/login are NOT needed.
#   - nats-streaming:0.25.6 is a modern server; the streaming protocol is compatible with the
#     0.4.6 queue-worker (cluster_id must stay `faas-cluster`).
#
# Deploy:
#   cd OPENFAAS_DEPLOY
#   docker swarm init          # one-time, if not already a manager
#   docker stack deploy openfaas -c docker-compose.yml
#   docker service ls          # wait until gateway/1/1
#   curl -s http://127.0.0.1:8080/version

version: "3.3"

services:
  gateway:
    image: functions/gateway:0.8.3
    ports:
      - "8080:8080"
    networks:
      - functions
    environment:
      functions_provider_url: "http://faas-swarm:8080/"
      read_timeout: "5m5s"
      write_timeout: "5m5s"
      upstream_timeout: "5m"
      dnsrr: "true"
      faas_nats_address: "nats"
      faas_nats_port: 4222
      direct_functions: "true"
      direct_functions_suffix: ""
    deploy:
      resources:
        reservations:
          memory: 100M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 20
        window: 380s
      placement:
        constraints:
          - "node.platform.os == linux"

  faas-swarm:
    image: functions/faas-swarm:0.3.3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - functions
    environment:
      read_timeout: "5m5s"
      write_timeout: "5m5s"
      DOCKER_API_VERSION: "1.30"
    deploy:
      placement:
        constraints:
          - "node.role == manager"
          - "node.platform.os == linux"
      resources:
        reservations:
          memory: 100M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 20
        window: 380s

  nats:
    image: nats-streaming:0.25.6
    command: "--store memory --cluster_id faas-cluster"
    networks:
      - functions
    deploy:
      resources:
        limits:
          memory: 125M
        reservations:
          memory: 50M
      placement:
        constraints:
          - "node.platform.os == linux"

  queue-worker:
    image: functions/queue-worker:0.4.6
    networks:
      - functions
    environment:
      max_inflight: "1"
      ack_wait: "5m5s"
      gateway_invoke: "true"
      faas_gateway_address: "gateway"
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 20M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 20
        window: 380s
      placement:
        constraints:
          - "node.platform.os == linux"

  # Monitoring

  prometheus:
    image: prom/prometheus:v2.11.0
    environment:
      no_proxy: "gateway"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/alert.rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    networks:
      - functions
    deploy:
      placement:
        constraints:
          - "node.role == manager"
          - "node.platform.os == linux"
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 200M

  alertmanager:
    image: prom/alertmanager:v0.18.0
    environment:
      no_proxy: "gateway"
    command:
      - "--config.file=/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - functions
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 20M
      placement:
        constraints:
          - "node.role == manager"
          - "node.platform.os == linux"
    configs:
      - source: alertmanager_config
        target: /alertmanager.yml

configs:
  prometheus_config:
    file: ./prometheus/prometheus.yml
  prometheus_rules:
    file: ./prometheus/alert.rules.yml
  alertmanager_config:
    file: ./prometheus/alertmanager.yml

networks:
  functions:
    driver: overlay
    attachable: true
    labels:
      - "openfaas=true"
