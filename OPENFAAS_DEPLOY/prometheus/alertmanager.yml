# Alertmanager for the OpenFaaS swarm stack. The gateway 0.8.3 has NO basic auth,
# so the scale-up webhook is unauthenticated (the /system/alert endpoint is open).
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 30s
  receiver: scale-up
  routes:
  - match:
      service: gateway
      receiver: scale-up
      severity: major
inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'cluster', 'service']
receivers:
- name: 'scale-up'
  webhook_configs:
    - url: http://gateway:8080/system/alert
      send_resolved: true
